# Gizli değerler Git'te tutulmaz; External Secrets Operator ile Vault / AWS SM / Azure KV'den çekilir.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: devblog-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: devblog-vault }
  target: { name: devblog-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: devblog/prod }

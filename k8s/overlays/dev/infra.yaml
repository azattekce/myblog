# Yalnızca DEV: altyapı küme içinde tek replika StatefulSet. Prod'da yönetilen servisler kullanılır.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mssql, labels: { app.kubernetes.io/name: mssql, app.kubernetes.io/component: data } }
spec:
  serviceName: mssql
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mssql } }
  template:
    metadata: { labels: { app.kubernetes.io/name: mssql, app.kubernetes.io/component: data } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: Developer }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: devblog-secrets, key: DB_PASSWORD } }
          ports: [{ name: sql, containerPort: 1433 }]
          resources: { requests: { cpu: 500m, memory: 2Gi }, limits: { memory: 3Gi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/opt/mssql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: mssql }
spec:
  selector: { app.kubernetes.io/name: mssql }
  ports: [{ name: sql, port: 1433, targetPort: sql }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: data } }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: data } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy volatile-lru"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: devblog-secrets, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 320Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: rabbitmq, labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: data } }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: rabbitmq } }
  template:
    metadata: { labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: data } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: devblog-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: devblog-secrets, key: RABBITMQ_PASSWORD } }
          ports: [{ name: amqp, containerPort: 5672 }, { name: metrics, containerPort: 15692 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports: [{ name: amqp, port: 5672, targetPort: amqp }, { name: metrics, port: 15692, targetPort: metrics }]

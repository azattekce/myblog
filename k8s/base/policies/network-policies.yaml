# Zero-trust: varsayılan olarak tüm giriş kapalı, yalnızca gerekli akışlar açık.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Ingress controller → gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-to-gateway }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ port: 8080 }]
---
# gateway → API servisleri ve frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-gateway-to-apps }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [api, web] }
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: gateway } } }]
      ports: [{ port: 8000 }, { port: 8080 }]
---
# Uygulamalar → veri katmanı (mssql, redis, rabbitmq)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apps-to-data }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: data } }
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [api, worker] }
      ports: [{ port: 1433 }, { port: 6379 }, { port: 5672 }]
---
# monitoring namespace'indeki Prometheus → metrik uçları
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-prometheus-scrape }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/part-of: devblog } }
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8000 }, { port: 9100 }, { port: 8081 }]

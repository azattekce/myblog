# activity-worker — RabbitMQ tüketicisi (audit + bildirim)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-worker
  labels:
    app.kubernetes.io/name: activity-worker
    app.kubernetes.io/part-of: devblog
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: activity-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activity-worker
        app.kubernetes.io/part-of: devblog
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9100'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: devblog-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: activity-worker
      containers:
      - name: activity-worker
        image: devblog/activity-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9100
        envFrom:
        - configMapRef:
            name: devblog-config
        env:
        - name: SERVICE_NAME
          value: activity-worker
        - name: METRICS_PORT
          value: '9100'
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: devblog-secrets
              key: REDIS_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: devblog-secrets
              key: RABBITMQ_URL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 20
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: activity-worker
  labels:
    app.kubernetes.io/name: activity-worker
    app.kubernetes.io/part-of: devblog
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: activity-worker
  ports:
  - name: metrics
    port: 9100
    targetPort: metrics
    protocol: TCP

# ============================================================================
#  API Gateway yönlendirme tablosu
#    /api/identity/*  → identity-service   (kimlik, JWT, refresh token)
#    /api/posts/*     → post-service       (yazılar, kategoriler, etiketler)
#    /api/comments/*  → comment-service    (yorumlar, moderasyon)
#    /*               → frontend           (React SPA)
#  Servislerin /metrics ve /health uçları dışarı AÇILMAZ (yalnızca iç ağ).
# ============================================================================

upstream identity_service { server identity-service:8000 max_fails=3 fail_timeout=10s; keepalive 16; }
upstream post_service     { server post-service:8000     max_fails=3 fail_timeout=10s; keepalive 32; }
upstream comment_service  { server comment-service:8000  max_fails=3 fail_timeout=10s; keepalive 16; }
upstream frontend_app     { server frontend:8080         max_fails=3 fail_timeout=10s; keepalive 16; }

server {
  listen 8080 default_server;
  server_name _;

  include /etc/nginx/snippets/security-headers.conf;
  limit_conn conn_per_ip 50;

  # Gateway'in kendi sağlık ucu (LB/K8s probe)
  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }

  # İç uçların dışarıdan erişimini engelle
  location ~ ^/(metrics|health)(/|$) { return 404; }

  # ---------------- Identity ----------------
  # Kaba kuvvet saldırılarına karşı sıkı limit (servis içinde ayrıca hesap kilidi var)
  location = /api/identity/auth/login {
    limit_req zone=auth_strict burst=5 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://identity_service;
  }
  location /api/identity/ {
    limit_req zone=api_general burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://identity_service;
  }

  # ---------------- Posts ----------------
  location /api/posts/ {
    limit_req zone=api_general burst=60 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://post_service;
  }
  location = /api/posts {
    limit_req zone=api_general burst=60 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://post_service;
  }

  # ---------------- Comments ----------------
  # Yorum gönderimi (spam) için ayrı limit
  location = /api/comments {
    limit_req zone=comment_write burst=3 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://comment_service;
  }
  location /api/comments/ {
    limit_req zone=api_general burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://comment_service;
  }

  # Tanımsız API yolları SPA'ya düşmesin
  location /api/ {
    default_type application/problem+json;
    return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"Bilinmeyen API yolu","code":"route_not_found"}';
  }

  # ---------------- Frontend (SPA) ----------------
  location / {
    limit_req zone=api_general burst=100 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://frontend_app;
  }
}

# İç metrik ucu (nginx-prometheus-exporter). Port 8081 dışarı yayınlanmaz; yalnızca özel ağlar.
server {
  listen 8081;
  server_name _;
  access_log off;
  location = /stub_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }
  location / { return 404; }
}

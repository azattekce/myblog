# DevBlog API Gateway — ana yapılandırma
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Root olmayan kullanıcı için geçici dizinler
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30s;
  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;

  # --- Correlation ID: istemci gönderdiyse koru, yoksa üret -----------------
  map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
    "~[^A-Za-z0-9._-]" $request_id;   # enjeksiyon denemelerini reddet
  }

  # --- Merkezi loglama: JSON satırları stdout'a (Promtail → Loki) ----------
  log_format json_gateway escape=json
    '{"time":"$time_iso8601","service":"gateway","level":"info",'
    '"correlation_id":"$req_id","remote_addr":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_ms":$request_time,"upstream":"$upstream_addr",'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json_gateway;

  # --- Rate limiting bölgeleri (IP başına) ----------------------------------
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=comment_write:10m rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # --- Sıkıştırma ------------------------------------------------------------
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/problem+json application/javascript
             text/javascript image/svg+xml application/xml;

  # --- Content-Security-Policy: Swagger UI (yalnızca non-prod) CDN kullanır -
  map $uri $csp {
    "~^/api/[a-z]+/docs$" "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
  }

  include /etc/nginx/conf.d/*.conf;
}

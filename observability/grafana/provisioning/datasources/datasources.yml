apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: { timeInterval: 15s }
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Loglardaki correlation_id'den aynı isteğin tüm servislerdeki izine tek tıkla geç
      derivedFields:
        - name: correlation_id
          matcherType: label
          matcherRegex: correlation_id
          url: '{correlation_id="$${__value.raw}"}'
          datasourceUid: loki

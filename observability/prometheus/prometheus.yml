# Prometheus — tüm servislerin iç /metrics uçlarını çeker (gateway üzerinden dışarı açık değildir)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { system: devblog }

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # FastAPI mikroservisleri (prometheus-fastapi-instrumentator)
  - job_name: identity-service
    static_configs: [{ targets: ["identity-service:8000"], labels: { tier: api } }]
  - job_name: post-service
    static_configs: [{ targets: ["post-service:8000"], labels: { tier: api } }]
  - job_name: comment-service
    static_configs: [{ targets: ["comment-service:8000"], labels: { tier: api } }]

  # Arka plan tüketicisi
  - job_name: activity-worker
    static_configs: [{ targets: ["activity-worker:9100"], labels: { tier: worker } }]

  # Altyapı
  - job_name: gateway
    static_configs: [{ targets: ["nginx-exporter:9113"], labels: { tier: edge } }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"], labels: { tier: data } }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { tier: data } }]
  # Kuyruk bazında derinlik (DLQ alarmı için)
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params: { family: [queue_coarse_metrics] }
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { tier: data } }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"], labels: { tier: observability } }]

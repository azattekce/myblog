# Promtail: "logging=promtail" etiketli konteynerlerin JSON loglarını Loki'ye taşır.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # Servisler JSON log basar; düşük kardinaliteli alanlar label, diğerleri structured metadata olur
      - json:
          expressions:
            level: level
            logger: logger
            correlation_id: correlation_id
            event_type: event_type
            status: status
      # Gateway erişim logunda seviye 'info' sabit: HTTP durumuna göre yeniden hesapla
      - match:
          selector: '{service="gateway"}'
          stages:
            - template:
                source: level
                template: '{{ if ge (atoi .status) 500 }}error{{ else if ge (atoi .status) 400 }}warning{{ else }}info{{ end }}'
      - labels:
          level:
      - structured_metadata:
          correlation_id:
          event_type:
          logger:

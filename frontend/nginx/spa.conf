# Frontend konteyneri: yalnızca derlenmiş SPA'yı sunar. Güvenlik başlıkları gateway'de eklenir.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;

  # İçerik hash'li varlıklar: 1 yıl, değişmez
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html her zaman taze olmalı (yeni sürüm anında yayılsın)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: bilinmeyen yollar index.html'e düşer
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
